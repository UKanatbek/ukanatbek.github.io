<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Канатбек Узаков | Персональная страница</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #E0E0E0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #1E1E1E;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 450px;
            width: 100%;
            text-align: center;
            border: 1px solid #2C2C2C;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: linear-gradient(45deg, #4F46E5, #06B6D4);
            margin: 0 auto 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            color: #FFF;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(79, 70, 229, 0.4);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #FFFFFF;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 16px;
            color: #06B6D4;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        .bio {
            font-size: 15px;
            line-height: 1.6;
            color: #A3A3A3;
            margin-bottom: 32px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: #4F46E5;
            color: #FFFFFF;
        }

        .btn-primary:hover {
            background-color: #4338CA;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.4);
        }

        .btn-secondary {
            background-color: #2D2D2D;
            color: #E0E0E0;
            border: 1px solid #3D3D3D;
        }

        .btn-secondary:hover {
            background-color: #373737;
            color: #FFFFFF;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 32px;
            font-size: 12px;
            color: #525252;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Аватар-заглушка с первой буквой имени -->
        <div class="avatar">K</div>
        
        <h1>Канатбек Узаков</h1>
        <div class="subtitle">Личное пространство</div>
        
        <p class="bio">
            Добро пожаловать на мою персональную страницу. Здесь собираются мои идеи, творческие проекты и мысли. Пространство находится в процессе постоянного созидания и наполнения.
        </p>

        <div class="links-container">
            <!-- Кнопка автоматического написания письма на вашу новую почту -->
            <a href="mailto:kanatbek@kanatbek.org" class="btn btn-primary">Написать мне на почту</a>
            
            <!-- Заглушки для вашего будущего творчества (ссылки можно будет изменить) -->
            <a href="#" class="btn btn-secondary">Моё творчество / Портфолио</a>
            <a href="#" class="btn btn-secondary">Заметки и мысли</a>
        </div>

        <footer>
            © 2026 kanatbek.org
        </footer>
    </div>

</body>
</html>
